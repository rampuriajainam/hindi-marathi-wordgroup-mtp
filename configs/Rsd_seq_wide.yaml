# Rsd_seq in a wider working state (drafter idea seq_wide, mtp/model/wide_heads.py): z_0 = [h; SiLU(U h)] of D = wide_mult * H
# numbers, one word read out per step through P (init: first H numbers), F zero-init, so training starts exactly at Rsd_seq.
# wide_shared: one F for every step instead of one per step. Pilots: --set optim.max_steps=2000, compare with Rsd_seq_p2k.
# Rsd_seq: = Rsd with sequential (Hydra / EAGLE-style) heads: head d also reads the tokens it drafts on top of (heads.py, head_type seq)
# Run list: docs/runs.md. Fields: INTERFACES §6 (+ optional: head_layers, optim.grad_accum,
# optim.weight_decay, data.eval_n, weighting.head_decay, log_every). TBD = decided later; train.py fails loudly on it.
run_name: Rsd_hi_k4_frozen_sd_seq_wide
lang: hi
model_name: LingoIITGN/ganga-1b
num_heads: 4
head_type: seq_wide
wide_mult: 2.0      # D = wide_mult * H (1.0 + wide_shared false = Rsd_seq exactly)
wide_shared: false  # true: one update block F shared by every step
wide_expand: silu   # z_0 = [h; SiLU(U h)]; linear: [h; U h]
head_layers: 1
freeze_backbone: true   # Medusa-1: LoRA frozen, head 0 = base model exactly
head_backbone_grad: 0.1   # extra heads send 10% of their gradient into LoRA (2k-step pilot: head 0 +0.011 vs R0)
lora: {r: 8, alpha: 16, dropout: 0.05, targets: [q_proj, v_proj]}
optim: {lr: 2.0e-4, batch_size: 8, grad_clip: 1.0, max_steps: 12500, grad_accum: 1, weight_decay: 0.01}
data: {cache_dir: /kaggle/input/mtp-boundary-cache, grouper: hi_rules_v0, max_length: 128, eval_split: eval, eval_n: 1000, train_file: /kaggle/working/sd/hi_sd.jsonl}  # -> hi_rules_v1 when JI-1 lands
losses:
  structural: {enabled: false, variant: null, weight: 1.0}
  contrastive: {enabled: false, weight: 0.05, temperature: 0.1}
weighting: {scheme: fixed, head_decay: 0.8}
log_every: 20
eval_every: 1000
save_every: 500
seed: 42
dtype: auto
